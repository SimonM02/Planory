<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Planory erklärt</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;background:#0b0f17;overflow:hidden}
body{font-family:'Inter Display','Inter',sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#0b0f17}
#cam{position:absolute;inset:0}
.bg{position:absolute;inset:0;background:radial-gradient(120% 75% at 50% 35%,#171e2c 0%,#0c1019 58%,#06080d 100%)}
.grid{position:absolute;left:-360px;top:-360px;width:1800px;height:2640px;
 background-image:linear-gradient(rgba(255,255,255,.05) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.05) 2px,transparent 2px),linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);
 background-size:180px 180px,180px 180px,36px 36px,36px 36px;-webkit-mask-image:radial-gradient(closest-side,#000 35%,transparent 100%)}
.glow{position:absolute;width:1500px;height:1500px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,159,28,.24),rgba(255,159,28,0));pointer-events:none}
.glow.b{background:radial-gradient(closest-side,rgba(80,120,255,.13),rgba(80,120,255,0))}
.line{position:absolute;overflow:hidden;line-height:1.03;padding:0 .05em .14em;white-space:nowrap;font-weight:900;letter-spacing:-.04em;word-spacing:.12em}
.line.c{left:0;right:0;text-align:center}
.line.l{left:150px}
.line>span{display:inline-block;transform-origin:0 100%}
em{font-style:normal;color:#ff9f1c}
.sub{position:absolute;left:152px;font-family:'Inter';font-weight:600;font-size:34px;color:#9aa6b8;white-space:nowrap}
#badge{position:absolute;left:66px;top:226px;display:flex;align-items:center;gap:18px}
#badgeIcon{width:72px;height:72px;border-radius:18px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#badge .t1{font-family:'Inter';font-weight:800;font-size:22px;letter-spacing:.24em;color:#ff9f1c}
#badge .t2{font-family:'Inter Display';font-weight:900;font-size:36px;letter-spacing:-.02em;margin-top:2px}
#num{position:absolute;left:66px;top:352px;width:66px;height:66px;border-radius:50%;background:#ff9f1c;color:#11151f;font:900 40px 'Inter Display';display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(255,159,28,.4)}
#dots{position:absolute;left:66px;top:440px;display:flex;flex-direction:column;gap:10px}
#dots i{display:block;width:8px;height:22px;border-radius:4px;background:rgba(255,255,255,.18)}
/* Handy */
.phone{position:absolute;background:linear-gradient(150deg,#454c5c 0%,#161a23 26%,#0b0e14 70%,#2d3340 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.14),inset 0 0 0 5px rgba(0,0,0,.55),0 60px 120px -20px rgba(0,0,0,.75),0 25px 50px rgba(0,0,0,.35)}
.screen{position:relative;width:100%;height:100%;overflow:hidden;background:#f3f4f7}
.scroll{display:none}
.sbar{position:absolute;left:0;right:0;top:0;background:#fff;display:flex;align-items:center;justify-content:space-between;font-family:'Inter';font-weight:600;color:#000;z-index:6}
.island{position:absolute;left:50%;transform:translateX(-50%);background:#000;border-radius:999px}
.glare{position:absolute;left:-60%;top:-20%;width:220%;height:140%;background:linear-gradient(110deg,transparent 42%,rgba(255,255,255,.16) 49%,rgba(255,255,255,.04) 53%,transparent 58%);pointer-events:none;z-index:7}
.stack{position:absolute;inset:0;overflow:hidden}
.stack .pg{position:absolute;left:0;top:0;display:block}
.stack .dim{position:absolute;inset:0;background:rgba(10,14,22,.42)}
.stack .md{position:absolute;overflow:hidden;border-radius:22px;box-shadow:0 20px 50px rgba(0,0,0,.35);background:#fff}
.stack .md img{position:absolute;left:0;top:0;display:block}
#fxl{position:absolute;inset:0;z-index:5;pointer-events:none}
.hl{position:absolute;border:5px solid #ff9f1c;border-radius:16px;box-shadow:0 0 0 6px rgba(255,159,28,.22),0 0 30px rgba(255,159,28,.5)}
.rip{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,159,28,.35);border:4px solid #ff9f1c}
.chk{position:absolute;width:44px;height:44px;border-radius:50%;background:#1aa35c;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(26,163,92,.45)}
.toast{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);background:#1d2430;color:#fff;font:700 26px Inter;padding:16px 26px;border-radius:999px;white-space:nowrap;box-shadow:0 12px 30px rgba(0,0,0,.35)}
/* Lupe */
#lens{position:absolute;overflow:hidden;border-radius:30px;background:#fff;box-shadow:0 0 0 6px #fff,0 0 0 10px #ff9f1c,0 50px 100px -10px rgba(0,0,0,.7)}
#lens img{position:absolute;left:0;top:0;display:block}
#lensTag{position:absolute;background:#ff9f1c;color:#11151f;font:800 24px Inter;padding:8px 18px;border-radius:999px;white-space:nowrap}
.chip{position:absolute;left:50%;transform:translateX(-50%);background:rgba(20,24,32,.85);backdrop-filter:blur(16px);color:#fff;font:700 34px Inter;padding:20px 34px;border-radius:999px;white-space:nowrap;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.14),0 20px 50px rgba(0,0,0,.5)}
/* Rechnung (wie Reel 1) */
.rc{position:absolute;width:430px;height:600px;filter:drop-shadow(0 40px 50px rgba(0,0,0,.55))}
.rc-paper{position:absolute;inset:0;background:#fbfaf6;border-radius:12px 12px 0 0;padding:36px 34px;color:#1d2430;font-family:'Inter'}
.rc-paper .co{font-weight:900;font-size:23px}.rc-paper .ad{font-size:16px;color:#7a8394;margin-top:4px}
.rc-paper .ti{font-weight:900;font-size:31px;letter-spacing:.04em;margin:26px 0 16px}
.rr{display:flex;justify-content:space-between;font-size:21px;padding:7px 0;font-variant-numeric:tabular-nums}
.rr span:first-child{color:#5b6475}.rr.it{font-weight:700;margin-top:36px}.rr.it span{color:#1d2430!important}
.rsep{border-top:2px dashed #c9ced8;margin:8px 0}.rr.tt{font-size:28px;font-weight:900;padding-top:12px}.rr.tt span{color:#1d2430!important}
.cor{position:absolute;width:80px;height:80px;border-color:#ff9f1c;border-style:solid;border-width:0}
.laser{position:absolute;left:-16px;right:-16px;height:6px;background:#ffb24d;border-radius:3px;box-shadow:0 0 18px 4px rgba(255,159,28,.9),0 0 60px 12px rgba(255,159,28,.45)}
/* Ende */
.cta{position:absolute;left:50%;top:1290px;height:120px;padding:0 60px;border-radius:60px;background:linear-gradient(180deg,#ffb042,#ff9f1c 55%,#f28c00);color:#11151f;font-family:'Inter';font-weight:800;font-size:48px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;box-shadow:0 30px 70px -10px rgba(255,159,28,.55),inset 0 2px 0 rgba(255,255,255,.45)}
.shim{position:absolute;top:0;bottom:0;width:180px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);left:0}
#nextPill{position:absolute;left:50%;top:1160px;display:flex;align-items:center;gap:14px;padding:16px 30px;border-radius:999px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.16);font:700 32px Inter;white-space:nowrap}
.burst{position:absolute;width:10px;height:44px;border-radius:5px;background:#ff9f1c;left:-5px;top:-22px}
.ico path,.ico circle{fill:none;stroke-linecap:round;stroke-linejoin:round}
.dust{position:absolute;border-radius:50%;background:#fff}
#grain{position:absolute;inset:0;mix-blend-mode:overlay;opacity:.14;pointer-events:none}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse 85% 70% at 50% 46%,transparent 52%,rgba(0,0,0,.5) 100%);pointer-events:none}
.scene{position:absolute;inset:0;visibility:hidden}
</style></head><body>
<div id="stage"><div id="cam">
  <div class="bg"></div><div class="grid" id="grid"></div>
  <div class="glow" id="glowA"></div><div class="glow b" id="glowB"></div>
  <div id="dustL"></div>

  <div class="scene" id="sH">
    <svg class="ico" id="hIcon" viewBox="0 0 100 100" style="position:absolute;left:440px;top:520px;width:200px;height:200px;stroke:#ff9f1c" stroke-width="7"></svg>
    <div class="line c" id="h1" style="top:780px;font-size:118px"><span></span></div>
    <div class="line c" id="h2" style="top:920px;font-size:118px"><span><em></em></span></div>
  </div>

  <div class="scene" id="sS">
    <div id="num">1</div><div id="dots"></div>
    <div class="line l" id="st1" style="top:330px;font-size:92px"><span></span></div>
    <div class="line l" id="st2" style="top:432px;font-size:92px"><span><em></em></span></div>
    <div class="sub" id="ssub" style="top:556px"></div>
    <div id="phWrap"></div>
    <div id="rcWrap"></div>
    <div id="lens"><img id="lensImg" alt=""></div>
    <div class="chip" id="chip"></div>
  </div>

  <div class="scene" id="sE">
    <div class="bg"></div><div class="grid" id="grid2"></div>
    <div class="glow" id="eGlow" style="left:-210px;top:60px"></div>
    <div id="eBurst" style="position:absolute;left:540px;top:700px"></div>
    <div id="eLogo" style="position:absolute;left:390px;top:550px;width:300px;height:300px"></div>
    <div class="line c" id="eW" style="top:880px;font-size:156px"><span id="eWs"></span></div>
    <div class="line c" id="eT" style="top:1064px;font-size:56px;letter-spacing:-.02em"><span></span></div>
    <div id="nextPill"><span style="color:#ff9f1c">▶</span><span id="nextTxt"></span></div>
    <div class="cta" id="cta"><div class="shim" id="shim"></div><span style="position:relative">Jetzt starten →</span></div>
    <div class="line c" id="eU" style="top:1440px;font-size:38px;font-family:Inter;font-weight:700;letter-spacing:.01em;word-spacing:0"><span>planory.at <span style="color:#ff9f1c">·</span> iPhone &amp; Web</span></div>
  </div>

  <div id="badge"><div id="badgeIcon"></div><div><div class="t1">PLANORY ERKLÄRT</div><div class="t2" id="badgeT"></div></div></div>
</div>
<div id="vig"></div><div id="grain"></div>
</div>
<script src="../reel/common.js"></script>
<script src="folgen.js"></script>
<script>
const EP = FOLGEN[+(new URLSearchParams(location.search).get('ep') || 1)];
const ICONS = {
  donut: `<circle cx="50" cy="50" r="34" pathLength="1" style="opacity:.35"/><path pathLength="1" d="M50 16 A34 34 0 0 1 82.3 39.5"/>`,
  receipt: `<path pathLength="1" d="M26 12 H74 V88 L66 82 L58 88 L50 82 L42 88 L34 82 L26 88 Z"/><path pathLength="1" d="M38 33 H62 M38 47 H62 M38 61 H53"/>`,
};
const HOOK_END = EP.steps[0].t0, END = EP.end.t0;
// Handy-Maße (flach, ohne Neigung – damit Lupen/Rahmen exakt sitzen)
const SW = 520, B = Math.round(SW * .032), PW = SW + 2 * B, PX = Math.round((1080 - PW) / 2), PY0 = 690;
const SB = Math.round(SW * .125), K = SW / 1170, MX = 10, MW = SW - 2 * MX, MT = 18;
const IMG = {};   // name -> {src, w, h}

function stepAt(t) { let s = null; EP.steps.forEach(x => { if (t >= x.t0 - .001) s = x; }); return s; }
function shotsAll() { return EP.steps.flatMap(s => s.shots); }
function msAt(sh, t) { const m = sh.mscroll || 0; if (!Array.isArray(m)) return m; const st = sh.mst || [sh.t, sh.t + .01]; return lerp(m[0], m[1], E.inOutCubic(p(t, st[0], st[1]))); }
function fitLine(el, maxW, fs0) { const sp = el.firstElementChild; let fs = fs0; el.style.fontSize = fs + 'px'; while (sp.offsetWidth > maxW && fs > 40) { fs -= 2; el.style.fontSize = fs + 'px'; } }
function scrollAt(sh, t) { const [a, b] = sh.scroll || [0, 0]; const st = sh.st || [sh.t, sh.t + .01]; return lerp(a, b, E.inOutCubic(p(t, st[0], st[1]))); }
// Rechteck (Bild-Pixel) -> Bildschirm-Koordinaten im Handy
function toScreen(sh, r, t) {
  if (sh.modal) { const km = MW / IMG[sh.modal].w, my = msAt(sh, t); return [MX + r[0] * km, SB + MT + (r[1] - my) * km, r[2] * km, r[3] * km]; }
  const s = scrollAt(sh, t); return [r[0] * K, SB + (r[1] - s) * K, r[2] * K, r[3] * K];
}
function shotAt(t) { const all = shotsAll(); let i = -1; all.forEach((s, k) => { if (t >= s.t - .001) i = k; }); return { cur: all[Math.max(0, i)], prev: i > 0 ? all[i - 1] : null }; }

function buildStack(id) { return `<div class="stack" id="${id}"><img class="pg"><div class="dim"></div><div class="md"><img></div></div>`; }
function paintStack(el, sh, t) {
  const pg = el.querySelector('.pg'), md = el.querySelector('.md'), dim = el.querySelector('.dim');
  const src = IMG[sh.page].src; if (pg.getAttribute('src') !== src) pg.setAttribute('src', src);
  pg.style.width = SW + 'px'; pg.style.transform = `translateY(${SB - scrollAt(sh, t) * K}px)`;
  const on = !!sh.modal; md.style.display = dim.style.display = on ? '' : 'none';
  if (on) { const m = IMG[sh.modal], km = MW / m.w, im = md.querySelector('img');
    if (im.getAttribute('src') !== m.src) im.setAttribute('src', m.src);
    im.style.width = MW + 'px'; im.style.transform = `translateY(${-msAt(sh, t) * km}px)`;
    md.style.left = MX + 'px'; md.style.top = (SB + MT) + 'px'; md.style.width = MW + 'px'; md.style.height = Math.min(m.h * km, 2165 * SW / 1000 - SB - MT - 10) + 'px'; }
}

function setup() {
  $('badgeIcon').innerHTML = logoSVG(); $('eLogo').innerHTML = logoSVG();
  $('badgeT').textContent = `Folge ${EP.nr} · ${EP.titel}`;
  $('hIcon').innerHTML = ICONS[EP.icon] || '';
  $('h1').firstElementChild.textContent = EP.hook[0]; $('h2').querySelector('em').textContent = EP.hook[1];
  fitLine($('h1'), 960, 118); fitLine($('h2'), 960, 118);
  $('dots').innerHTML = EP.steps.map(() => '<i></i>').join('');
  $('phWrap').innerHTML = phone('ph', '', SW); PH.ph = $('ph');
  const scr = PH.ph.querySelector('.screen'); scr.querySelector('.scroll').remove();
  scr.insertAdjacentHTML('afterbegin', buildStack('stA') + buildStack('stB') + '<div id="fxl"></div>');
  $('rcWrap').innerHTML = `<div class="rc" id="rc"><div class="rc-paper" id="rcp"><div class="co">MUSTER INSTALLATIONEN</div><div class="ad">Musterstraße 1 · 8010 Graz</div><div class="ti">RECHNUNG</div>
    <div class="rr"><span>Datum</span><span>${new Date().toLocaleDateString('de-AT')}</span></div><div class="rr it"><span>Sanitär Rohinstallation</span></div><div class="rsep"></div>
    <div class="rr"><span>Material</span><span>12.400,00</span></div><div class="rr"><span>Arbeitszeit</span><span>4.266,67</span></div><div class="rr"><span>USt. 20 %</span><span>3.333,33</span></div><div class="rsep"></div>
    <div class="rr tt"><span>GESAMT</span><span>€ 20.000,00</span></div></div>
    <div id="rcClip" style="position:absolute;inset:0;overflow:hidden"><div id="rcTrail" style="position:absolute;left:0;right:0;height:200px;background:linear-gradient(to bottom,rgba(255,159,28,0),rgba(255,159,28,.18))"></div></div>
    <div class="laser" id="rcLaser"></div>
    <div class="cor" id="q1" style="left:-28px;top:-28px;border-width:9px 0 0 9px;border-radius:24px 0 0 0"></div><div class="cor" id="q2" style="right:-28px;top:-28px;border-width:9px 9px 0 0;border-radius:0 24px 0 0"></div>
    <div class="cor" id="q3" style="left:-28px;bottom:-28px;border-width:0 0 9px 9px;border-radius:0 0 0 24px"></div><div class="cor" id="q4" style="right:-28px;bottom:-28px;border-width:0 9px 9px 0;border-radius:0 0 24px 0"></div></div>`;
  const zz = [], W = 430, H = 600, n = 15; zz.push('0 0', `${W}px 0`, `${W}px ${H}px`); for (let i = n * 2; i >= 0; i--) zz.push(`${(W * i / (n * 2)).toFixed(1)}px ${i % 2 ? H - 16 : H}px`);
  $('rcp').style.clipPath = `polygon(${zz.join(',')})`;
  // Effekt-Elemente im Handy anlegen
  const fxl = $('fxl'); EP.steps.forEach((s, si) => s.fx.forEach((f, fi) => { f.id = `fx${si}_${fi}`;
    if (f.k === 'hl') fxl.insertAdjacentHTML('beforeend', `<div class="hl" id="${f.id}"></div>`);
    if (f.k === 'tap') fxl.insertAdjacentHTML('beforeend', `<div class="rip" id="${f.id}"></div>`);
    if (f.k === 'grow') fxl.insertAdjacentHTML('beforeend', `<div id="${f.id}" style="position:absolute;background:#fff"></div>`);
    if (f.k === 'uncheck') fxl.insertAdjacentHTML('beforeend', `<div id="${f.id}" style="position:absolute;border-radius:5px;background:#ff9f1c;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" style="width:80%;height:80%"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`);
    if (f.k === 'checks') f.rs.forEach((r, j) => fxl.insertAdjacentHTML('beforeend', `<div class="hl" id="${f.id}_h${j}" style="border-color:#1aa35c;box-shadow:0 0 0 5px rgba(26,163,92,.18)"></div><div class="chk" id="${f.id}_c${j}"><svg viewBox="0 0 24 24" style="width:28px;height:28px"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`));
    if (f.k === 'toast') fxl.insertAdjacentHTML('beforeend', `<div class="toast" id="${f.id}">${f.text}</div>`);
  }));
  $('eWs').innerHTML = 'Planory'.split('').map((c, i) => `<span style="display:inline-block;${i >= 4 ? 'color:#ff9f1c' : ''}">${c}</span>`).join('');
  $('eT').firstElementChild.innerHTML = `${EP.end.tagline[0]}<em>${EP.end.tagline[1]}</em>`;
  $('nextTxt').textContent = 'Nächste Folge: ' + EP.end.next;
  $('eBurst').innerHTML = Array.from({ length: 12 }, () => '<i class="burst"></i>').join('');
  const R = rnd(7); $('dustL').innerHTML = Array.from({ length: 30 }, () => { const s = 2 + R() * 4; return `<i class="dust" style="width:${s}px;height:${s}px;${R() < .35 ? 'background:#ffb24d;' : ''}" data-x="${R() * 1080}" data-y="${R() * 1920}" data-v="${20 + R() * 50}" data-o="${.12 + R() * .3}" data-ph="${R() * 6.28}"></i>`; }).join('');
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'), im = g.createImageData(256, 256), r2 = rnd(3);
  for (let i = 0; i < im.data.length; i += 4) { const v = Math.floor(r2() * 255); im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  g.putImageData(im, 0, 0); $('grain').style.backgroundImage = `url(${c.toDataURL()})`;
}

// ---------- Effekte ----------
function place(el, sh, r, t, pad = 8) { const [x, y, w, h] = toScreen(sh, r, t); el.style.left = (x - pad) + 'px'; el.style.top = (y - pad) + 'px'; el.style.width = (w + 2 * pad) + 'px'; el.style.height = (h + 2 * pad) + 'px'; }
function shotFor(f) { const all = shotsAll(); let s = all[0]; all.forEach(x => { if (f.t >= x.t - .001) s = x; }); return s; }
function fxRender(t) {
  let lens = null, chip = null;
  vis($('rc'), false);   // Rechnung nur während eines scan-Effekts
  EP.steps.forEach(s => s.fx.forEach(f => {
    const el = $(f.id), sh = shotFor(f);
    if (f.k === 'hl') { const q = p(t, f.t, f.t + .25), o = p(t, f.t1 - .2, f.t1); vis(el, t >= f.t && t < f.t1); place(el, sh, f.r, t); el.style.opacity = q * (1 - o); el.style.transform = `scale(${1.08 - .08 * E.outBack(q)})`; }
    if (f.k === 'tap') { const l = p(t, f.t, f.t + .45); vis(el, l > 0 && l < 1); const [x, y, w, h] = toScreen(sh, f.r, t); el.style.left = (x + w / 2) + 'px'; el.style.top = (y + h / 2) + 'px'; el.style.transform = `scale(${.3 + 1.2 * E.outCubic(l)})`; el.style.opacity = 1 - l; }
    if (f.k === 'grow') { const q = E.outCubic(p(t, f.t, f.t + f.d)); const on = t >= s.t0 && t < s.t1 && q < 1; vis(el, on); const [x, y, w, h] = toScreen(sh, f.r, t); el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.height = (h * (1 - q)) + 'px'; }
    if (f.k === 'uncheck') { const on = t >= s.t0 && t < f.t + .35 && t < s.t1; vis(el, on); place(el, sh, f.r, t, 0); const q = p(t, f.t, f.t + .3); el.style.opacity = 1 - q; el.style.transform = `scale(${1 - .4 * q})`; }
    if (f.k === 'checks') f.rs.forEach((r, j) => { const tj = f.t + j * f.dt, h = $(`${f.id}_h${j}`), c = $(`${f.id}_c${j}`), on = t >= tj && t < s.t1 - .05, q = p(t, tj, tj + .25);

// ---------- Szenen ----------
function hook(t) { const on = t < HOOK_END + .05; vis($('sH'), on); if (!on) return;

  ic.style.transform = `scale(${.7 + .3 * spring(t, 1.4, 6)})`; }
