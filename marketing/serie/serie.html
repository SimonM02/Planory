<script>
const EP = FOLGEN[+(new URLSearchParams(location.search).get('ep') || 1)];
const HELL = new URLSearchParams(location.search).get('hell') === '1';   // helle Fassung (siehe CSS „html.hell“)
if (HELL) document.documentElement.classList.add('hell');
const COVER = EP.coverDur || 1.3;   // Titelbild am Anfang (auch Vorschau im Feed); je Video einstellbar
const ICONS = {
  donut: `<circle cx="50" cy="50" r="34" pathLength="1" style="opacity:.35"/><path pathLength="1" d="M50 16 A34 34 0 0 1 82.3 39.5"/>`,
  receipt: `<path pathLength="1" d="M26 12 H74 V88 L66 82 L58 88 L50 82 L42 88 L34 82 L26 88 Z"/><path pathLength="1" d="M38 33 H62 M38 47 H62 M38 61 H53"/>`,
  cal: `<path pathLength="1" d="M18 26 H82 V84 H18 Z"/><path pathLength="1" d="M18 43 H82"/><path pathLength="1" d="M34 15 V32 M66 15 V32"/><path pathLength="1" d="M33 59 h2 M49 59 h2 M65 59 h2 M33 71 h2 M49 71 h2"/>`,
  check: `<path pathLength="1" d="M20 16 H80 Q84 16 84 20 V80 Q84 84 80 84 H20 Q16 84 16 80 V20 Q16 16 20 16 Z"/><path pathLength="1" d="M32 51 L45 64 L70 37"/>`,
  camera: `<path pathLength="1" d="M14 34 H32 L38 24 H62 L68 34 H86 V80 H14 Z"/><circle cx="50" cy="56" r="14" pathLength="1"/>`,
  compare: `<path pathLength="1" d="M12 22 H44 V82 H12 Z"/><path pathLength="1" d="M56 22 H88 V82 H56 Z"/><path pathLength="1" d="M20 38 H36 M20 50 H36 M64 38 H80 M64 50 H80 M20 64 H30 M64 64 H76"/>`,
  euro: `<circle cx="50" cy="50" r="36" pathLength="1"/><path pathLength="1" d="M63 36 A15 15 0 1 0 63 64"/><path pathLength="1" d="M33 46 H55 M33 55 H55"/>`,
  doc: `<path pathLength="1" d="M24 12 H62 L78 28 V88 H24 Z"/><path pathLength="1" d="M62 12 V28 H78"/><path pathLength="1" d="M34 46 H68 M34 58 H68 M34 70 H56"/>`,
  warn: `<path pathLength="1" d="M50 14 L88 82 H12 Z"/><path pathLength="1" d="M50 40 V60 M50 70 V71"/>`,
  people: `<circle cx="38" cy="36" r="12" pathLength="1"/><path pathLength="1" d="M14 80 Q14 58 38 58 Q62 58 62 80"/><circle cx="68" cy="40" r="9" pathLength="1"/><path pathLength="1" d="M66 58 Q88 58 88 78"/>`,
  spark: `<path pathLength="1" d="M50 12 C53 38 62 47 88 50 C62 53 53 62 50 88 C47 62 38 53 12 50 C38 47 47 38 50 12 Z"/>`,
  devices: `<path pathLength="1" d="M8 24 H68 V62 H8 Z"/><path pathLength="1" d="M2 72 H70"/><path pathLength="1" d="M74 36 H94 V84 H74 Z"/><path pathLength="1" d="M82 78 h4"/>`,
  house: `<path pathLength="1" d="M14 50 L50 18 L86 50"/><path pathLength="1" d="M24 42 V84 H76 V42"/><path pathLength="1" d="M44 84 V62 H56 V84"/>`,
};
const HOOK_END = EP.hookEnd || EP.steps[0].t0, PH_IN = EP.steps[0].t0, END = EP.end.t0;
const STEPS_END = EP.grid ? EP.grid.t0 : END;
// Handy-Maße (flach, damit Lupen/Rahmen exakt sitzen)
const SW = 520, B = Math.round(SW * .032), PW = SW + 2 * B, PX = Math.round((1080 - PW) / 2), PY0 = 690;
const SB = Math.round(SW * .125), K = SW / 1170, MX = 10, MW = SW - 2 * MX, MT = 18, SH = Math.round(SW * 2.165);
const IMG = {};   // Bild -> {src, w, h}
let BOX = {};     // aus screens/boxes.json

// ---------- gemessene Stellen ----------
function R(spec) {
  if (Array.isArray(spec) && typeof spec[0] !== 'number') { const rs = spec.map(R); const x = Math.min(...rs.map(r => r[0])), y = Math.min(...rs.map(r => r[1])), x2 = Math.max(...rs.map(r => r[0] + r[2])), y2 = Math.max(...rs.map(r => r[1] + r[3])); return [x, y, x2 - x, y2 - y]; }
  if (typeof spec === 'string') { const [img, n] = spec.split('.'); const r = BOX[img] && BOX[img][n]; if (!r) throw new Error('Box fehlt: ' + spec); return r; }
  if (spec && spec.b) { const r = R(spec.b); return [r[0] + (spec.dx || 0), r[1] + (spec.dy || 0), spec.w || r[2] - (spec.dx || 0), spec.h || r[3] - (spec.dy || 0)]; }
  return spec;
}

function stepAt(t) { let s = null; EP.steps.forEach(x => { if (t >= x.t0 - .001) s = x; }); return s; }
function shotsAll() { return EP.steps.flatMap(s => s.shots); }
function scrollAt(sh, t) { const [a, b] = sh.scroll || [0, 0]; const st = sh.st || [sh.t, sh.t + .01]; return lerp(a, b, E.inOutCubic(p(t, st[0], st[1]))); }
function msAt(sh, t) { const m = sh.mscroll || 0; if (!Array.isArray(m)) return m; const st = sh.mst || [sh.t, sh.t + .01]; return lerp(m[0], m[1], E.inOutCubic(p(t, st[0], st[1]))); }
function fitLine(el, maxW, fs0) { const sp = el.firstElementChild; let fs = fs0; el.style.fontSize = fs + 'px'; while (sp.offsetWidth > maxW && fs > 40) { fs -= 2; el.style.fontSize = fs + 'px'; } }
// Rechteck (Bild-Pixel) -> Bildschirm-Koordinaten im Handy
function toScreen(sh, r, t) {
  if (sh.modal) { const km = MW / IMG[sh.modal].w; return [MX + r[0] * km, SB + MT + (r[1] - msAt(sh, t)) * km, r[2] * km, r[3] * km]; }
